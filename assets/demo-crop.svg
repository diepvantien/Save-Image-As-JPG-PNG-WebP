<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="1200" height="800">
  <!-- Background Image Placeholder (Darkened) -->
  <rect width="600" height="400" fill="#2C2825" />
  <rect x="50" y="50" width="500" height="300" fill="#3D3834" />
  <circle cx="300" cy="200" r="80" fill="#4E4843" />
  <path d="M100 350 L250 150 L350 250 L550 50 L600 100 L600 400 L50 400 Z" fill="#35302C" />
  
  <!-- Overlay dimming -->
  <rect width="600" height="400" fill="rgba(0,0,0,0.6)" />
  
  <!-- Crop Area (Clear with border) -->
  <rect x="150" y="100" width="300" height="200" fill="transparent" stroke="#F8F4E6" stroke-width="2" stroke-dasharray="8,4" />
  
  <!-- Crop Image Highlight -->
  <clipPath id="crop-clip">
    <rect x="150" y="100" width="300" height="200" />
  </clipPath>
  <g clip-path="url(#crop-clip)">
    <rect x="50" y="50" width="500" height="300" fill="#4E4843" />
    <circle cx="300" cy="200" r="80" fill="#605953" />
    <path d="M100 350 L250 150 L350 250 L550 50 L600 100 L600 400 L50 400 Z" fill="#443E3A" />
  </g>

  <!-- Grid lines inside crop -->
  <line x1="250" y1="100" x2="250" y2="300" stroke="rgba(248,244,230,0.3)" stroke-width="1" />
  <line x1="350" y1="100" x2="350" y2="300" stroke="rgba(248,244,230,0.3)" stroke-width="1" />
  <line x1="150" y1="166" x2="450" y2="166" stroke="rgba(248,244,230,0.3)" stroke-width="1" />
  <line x1="150" y1="233" x2="450" y2="233" stroke="rgba(248,244,230,0.3)" stroke-width="1" />

  <!-- Crop Handles -->
  <rect x="145" y="95" width="10" height="10" fill="#FFF" stroke="#1E1B18" stroke-width="1" />
  <rect x="445" y="95" width="10" height="10" fill="#FFF" stroke="#1E1B18" stroke-width="1" />
  <rect x="145" y="295" width="10" height="10" fill="#FFF" stroke="#1E1B18" stroke-width="1" />
  <rect x="445" y="295" width="10" height="10" fill="#FFF" stroke="#1E1B18" stroke-width="1" />

  <!-- Toolbar -->
  <rect x="130" y="20" width="340" height="40" rx="20" fill="#F8F4E6" fill-opacity="0.95" stroke="#DACCB2" stroke-width="1" />
  
  <!-- Toolbar items -->
  <text x="150" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#887A65">Ratio:</text>
  <rect x="190" y="28" width="80" height="24" rx="12" fill="#EAE5D9" />
  <text x="230" y="44" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E1B18" text-anchor="middle">16:9 ▾</text>
  
  <rect x="290" y="25" width="70" height="30" rx="15" fill="#CD8B68" />
  <text x="325" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">Save</text>

  <rect x="375" y="25" width="70" height="30" rx="15" fill="#EAE5D9" />
  <text x="410" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E1B18" text-anchor="middle">Cancel</text>
</svg>